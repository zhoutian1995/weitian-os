map $http_origin $geo_origin_ok {
    default 0;
    "https://willeai.com" 1;
    "https://www.willeai.com" 1;
}
map $arg_event $geo_event {
    default "";
    ~^(page_view|resource_cta_click|wechat_qr_view|qr_download_click|consult_click)$ $arg_event;
}
map $arg_path $geo_path {
    default "";
    "~^(/|%2[Ff])[A-Za-z0-9_./%~-]{0,720}$" $arg_path;
}
map $arg_source $geo_source { default ""; "~^[A-Za-z0-9._%~-]{0,864}$" $arg_source; }
map $arg_medium $geo_medium { default ""; "~^[A-Za-z0-9._%~-]{0,864}$" $arg_medium; }
map $arg_campaign $geo_campaign { default ""; "~^[A-Za-z0-9._%~-]{0,864}$" $arg_campaign; }
map $arg_content $geo_content { default ""; "~^[A-Za-z0-9._%~-]{0,864}$" $arg_content; }
map $arg_referrer_host $geo_referrer { default ""; "~^[A-Za-z0-9.-]{0,253}$" $arg_referrer_host; }
map $arg_test $geo_test { default 0; "1" 1; }
limit_req_zone $binary_remote_addr zone=geo_events:1m rate=30r/m;
log_format geo_events escape=json '{"id":"$request_id","at":"$time_iso8601","status":$status,"kind":"$geo_event","path":"$geo_path","source":"$geo_source","medium":"$geo_medium","campaign":"$geo_campaign","content":"$geo_content","referrer_host":"$geo_referrer","test":$geo_test}';

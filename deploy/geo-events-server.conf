location = /_geo/event {
    if ($request_method != POST) { return 405; }
    if ($geo_origin_ok = 0) { return 403; }
    if ($geo_event = "") { return 400; }
    if ($geo_path = "") { return 400; }
    limit_req zone=geo_events burst=10 nodelay;
    access_log /var/log/nginx/geo-events.log geo_events;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /__geo_event_sink_not_a_file__ =204;
}
sub_filter_once on;
sub_filter '</head>' '<script src="/assets/geo-events.js" defer></script></head>';
